<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main">
        <div id="top">
            <h2>Metric/Imperial Unit Conversion</h2>
            <input id="input" type="number" placeholder="0">
            <button id="btn">Convert</button>
        </div>

        <div id="bottom">
            <div id="length">
                <h4>Length (Meters/Feet)</h4>
                <p id="length-conv"></p>
            </div>

            <div id="volume">
                <h4>Volume (Liters/Gallons)</h4>
                <p id="volume-conv"></p>
            </div>

            <div id="mass">
                <h4>Mass (Kilograms/Pounds)</h4>
                <p id="mass-conv"></p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
